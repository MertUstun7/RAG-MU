name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  quality:
    name: Quality
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install CI tools
        run: python -m pip install --requirement requirements-dev.txt

      - name: Lint
        run: ruff check --output-format=github .

      - name: Check formatting
        run: ruff format --check .

      - name: Compile Python sources
        run: python -m compileall -q -x '(chroma_db|temp_uploads)' .

      - name: Validate Compose configuration
        run: docker compose --env-file .env.example config --quiet

  container:
    name: Container
    needs: quality
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build application image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          tags: ragmu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Smoke test application image
        run: |
          set -euo pipefail
          docker run --detach --name ragmu-ci \
            --env DB_URL=sqlite:////tmp/ragmu.db \
            --env OLLAMA_BASE_URL=http://localhost:11434 \
            ragmu:ci

          for attempt in {1..30}; do
            if docker exec ragmu-ci python -c \
              "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/health', timeout=5)" \
              >/dev/null 2>&1; then
              exit 0
            fi

            if [ "$(docker inspect --format='{{.State.Status}}' ragmu-ci)" = "exited" ]; then
              break
            fi
            sleep 5
          done

          docker logs ragmu-ci
          exit 1

      - name: Remove smoke test container
        if: always()
        continue-on-error: true
        run: docker rm --force ragmu-ci
